# nginx configuration for the Intelli-Learn web container.
#
# Serves the built single-page app from /usr/share/nginx/html on port 8080 as
# the unprivileged nginx user. The container's root filesystem is read-only, so
# every file nginx writes lives under /tmp (a tmpfs in docker-compose.yml).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr error;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Privacy: the access log has no client address, no query string, no
    # referrer and no user agent. ($uri is the path without the query string.)
    log_format minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout minimal;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # text/html is always compressed. text/event-stream is left out on purpose so AI streams are never buffered.
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Cache policy by path.
    # - /assets/* and workbox-<hash>.js have a content hash in the name: cache for a year.
    # - index.html, sw.js, registerSW.js and the web manifest must always be revalidated,
    #   otherwise an update would not reach installed devices. That is the default.
    # - AI traffic is never cached: the AI proxy sends its own "no-store", so nothing is added here.
    map $uri $cache_control {
        default                                 "no-cache";
        ~^/ai-proxy/                            "";
        ~^/assets/                              "public, max-age=31536000, immutable";
        ~^/workbox-[0-9A-Za-z_-]+\.js$          "public, max-age=31536000, immutable";
        ~*\.(?:svg|png|ico|webp|woff2)$         "public, max-age=86400";
    }

    # The address of the device, for the rate limit of the AI proxy (its only spending guard).
    # nginx decides it and passes on exactly one value, so nothing a client writes into
    # X-Forwarded-For ever reaches the proxy:
    # - port 8080 is the published port. The client is whoever connected; the header is ignored.
    # - port 8081 is never published. Only a reverse proxy on the Docker network reaches it
    #   (Caddy, profile "https"), and the client is the last address that proxy reported.
    #   Never publish 8081 or point anything but your own reverse proxy at it.
    map "$server_port $http_x_forwarded_for" $client_address {
        default                                                     $remote_addr;
        "~^8081 (?:.*[, ])?(?<forwarded_last>[0-9A-Fa-f:.]+)\s*$"   $forwarded_last;
    }

    server {
        listen 8080;
        listen 8081;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        client_max_body_size 300k;

        # Security headers. They are set here only: no location below uses
        # add_header, because that would silently drop these inherited ones.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        # Only added to successful answers, so a 404 is never cached as "immutable".
        add_header Cache-Control $cache_control;

        # Container health check.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Optional AI proxy (docker compose --profile proxy). The upstream name is
        # resolved at request time through Docker's DNS, so nginx starts and the
        # app works even when the proxy container does not exist.
        location ^~ /ai-proxy/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 3s;
            set $ai_proxy_upstream "http://ai-proxy:8788";
            proxy_pass $ai_proxy_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # One address, chosen above. Not $proxy_add_x_forwarded_for: that would pass on
            # whatever the client sent, and a forged entry could pick the rate-limit bucket.
            proxy_set_header X-Forwarded-For $client_address;

            # Stream answers through as they arrive and wait patiently for slow models.
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Errors written by the proxy itself pass through unchanged. Only
            # "nginx could not reach the proxy" is turned into the JSON below.
            proxy_intercept_errors off;
            error_page 502 504 = @ai_proxy_unavailable;
        }

        location @ai_proxy_unavailable {
            default_type application/json;
            return 503 '{"error":{"message":"The AI proxy is not running on this server. Start it with the proxy profile, or choose another AI mode in the parent settings.","type":"proxy_unavailable"}}';
        }

        # The web manifest needs its own media type.
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            try_files $uri =404;
        }

        # A missing script, style, font or image must be a 404, never the app shell.
        location ~* \.(?:js|mjs|css|map|json|svg|png|ico|webp|woff2?|txt|webmanifest)$ {
            try_files $uri =404;
        }

        # Single-page app: every other path is a client-side route.
        location / {
            try_files $uri /index.html;
        }
    }
}
