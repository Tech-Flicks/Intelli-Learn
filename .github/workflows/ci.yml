name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds the app, serves it on port 4173, starts the mock AI on port 8787
      # and plays through the product as a phone and as a tablet.
      - name: End-to-end tests
        run: npm run e2e -- --trace off

      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the failure details
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the Compose file
        run: docker compose --profile proxy --profile https config --quiet

      - name: Build the web and AI proxy images
        run: docker compose --profile proxy build web ai-proxy
